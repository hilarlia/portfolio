<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Agentic research workflow network</title>
  <desc id="desc">Clean layout of connected research agents with non-overlapping labels and weekly loop flow.</desc>

  <defs>
    <style>
      .bg { fill: #fbfcff; }
      .human { fill: #0b3c8a; }
      .node { fill: #eef3ff; stroke: #2f5fb3; stroke-width: 2; }
      .title { fill: #1b2a4a; font: 700 24px Inter, Arial, sans-serif; }
      .body { fill: #2a3b5c; font: 500 18px Inter, Arial, sans-serif; }
      .humanText { fill: #ffffff; font: 700 28px Inter, Arial, sans-serif; }
      .humanSub { fill: #ffffff; font: 500 19px Inter, Arial, sans-serif; }
      .edge { stroke: #2f5fb3; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edgeSoft { stroke: #7c97d3; stroke-width: 2.5; fill: none; marker-end: url(#arrowSoft); }
      .label { fill: #25457f; font: 600 16px Inter, Arial, sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5fb3"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c97d3"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <!-- Human controller -->
  <rect class="human" x="500" y="40" width="600" height="110" rx="18"/>
  <text class="humanText" x="800" y="86" text-anchor="middle">Human Researcher (Final Judge)</text>
  <text class="humanSub" x="800" y="120" text-anchor="middle">Sets goals • accepts/rejects claims • writes manuscript</text>

  <!-- Top row -->
  <rect class="node" x="70" y="210" width="460" height="160" rx="14"/>
  <text class="title" x="100" y="252">1) Research Planner Agent</text>
  <text class="body" x="100" y="288">• Breaks goals into weekly tasks</text>
  <text class="body" x="100" y="316">• Defines pass/fail checks</text>
  <text class="body" x="100" y="344">• Tracks dependencies</text>

  <rect class="node" x="570" y="210" width="460" height="160" rx="14"/>
  <text class="title" x="600" y="252">2) Literature Scout Agent</text>
  <text class="body" x="600" y="288">• Finds relevant papers/baselines</text>
  <text class="body" x="600" y="316">• Flags assumption mismatches</text>
  <text class="body" x="600" y="344">• Updates reading queue</text>

  <rect class="node" x="1070" y="210" width="460" height="160" rx="14"/>
  <text class="title" x="1100" y="252">3) Theory Assistant Agent</text>
  <text class="body" x="1100" y="288">• Proposes derivation paths</text>
  <text class="body" x="1100" y="316">• Drafts lemma candidates</text>
  <text class="body" x="1100" y="344">• Marks fragile assumptions</text>

  <!-- Middle row -->
  <rect class="node" x="140" y="450" width="430" height="170" rx="14"/>
  <text class="title" x="170" y="492">4) Adversarial Critic Agent</text>
  <text class="body" x="170" y="528">• Searches counterexamples</text>
  <text class="body" x="170" y="556">• Builds failure scenarios</text>
  <text class="body" x="170" y="584">• Stress-tests claims</text>

  <rect class="node" x="585" y="450" width="430" height="170" rx="14"/>
  <text class="title" x="615" y="492">5) Simulation Engineer Agent</text>
  <text class="body" x="615" y="528">• Implements experiments</text>
  <text class="body" x="615" y="556">• Runs parameter sweeps</text>
  <text class="body" x="615" y="584">• Produces figures and logs</text>

  <rect class="node" x="1030" y="450" width="430" height="170" rx="14"/>
  <text class="title" x="1060" y="492">6) Reproducibility Agent</text>
  <text class="body" x="1060" y="528">• Reruns from clean env</text>
  <text class="body" x="1060" y="556">• Checks seed/config parity</text>
  <text class="body" x="1060" y="584">• Confirms reported metrics</text>

  <!-- Output box -->
  <rect class="node" x="360" y="720" width="880" height="150" rx="14"/>
  <text class="title" x="390" y="765">Weekly loop output</text>
  <text class="body" x="390" y="803">• Accepted/rejected claims • validated code/results • updated priorities • full audit log</text>
  <text class="body" x="390" y="833">This feeds directly into next week’s planning cycle.</text>

  <!-- Edges: human -> top row -->
  <path class="edge" d="M 650 150 L 300 210"/>
  <path class="edge" d="M 800 150 L 800 210"/>
  <path class="edge" d="M 950 150 L 1300 210"/>

  <!-- Edges: top -> middle -->
  <path class="edge" d="M 300 370 L 310 450"/>
  <path class="edge" d="M 800 370 L 800 450"/>
  <path class="edge" d="M 1300 370 L 1245 450"/>

  <!-- Edges: middle -> output -->
  <path class="edgeSoft" d="M 355 620 L 560 720"/>
  <path class="edgeSoft" d="M 800 620 L 800 720"/>
  <path class="edgeSoft" d="M 1245 620 L 1040 720"/>

  <!-- Feedback edge -->
  <path class="edge" d="M 1240 870 L 1540 870 L 1540 95 L 1105 95"/>
  <text class="label" x="1285" y="848">feedback to next loop</text>
</svg>
