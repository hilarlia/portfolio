<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Sequential quantum decisions and their possible futures</title><desc id="desc">Above, one quantum system is reused through three changing task contexts. Each context offers a finite set of two discrete control operations, represented by separate buttons; the filled button is selected. Below, a simplified planning tree alternates action choices, drawn as diamonds and solid connections, with random outcomes, drawn as circles and dashed connections. A blue outcome-dependent plan begins with a smaller immediate reward but reaches larger cumulative rewards. Gold bars consistently represent reward. Values are conceptual illustrations, not model results.</desc><defs><radialGradient id="orb" cx="30%" cy="22%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e0e8f8"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8a9bb9" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1440" height="820" rx="0" fill="white" stroke="none"/><rect x="252" y="43" width="178" height="166" rx="24" fill="#fcf0ee" stroke="none"/><rect x="272" y="92" width="62" height="68" rx="13" fill="#d75b64" stroke="#d75b64"/><rect x="291" y="114" width="24" height="24" rx="4" fill="none" stroke="white"/><circle cx="303" cy="126" r="3" fill="white" stroke="none" stroke-width="1"/><path d="M297 179 l4 4 l8 -9" stroke="#d75b64" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="348" y="92" width="62" height="68" rx="13" fill="white" stroke="#d75b64"/><path d="M379 110 L395 126 L379 142 L363 126 Z" stroke="#d75b64" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="379" cy="126" r="3" fill="#d75b64" stroke="none" stroke-width="1"/><rect x="636" y="43" width="178" height